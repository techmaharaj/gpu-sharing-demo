# Check that HAMi's memory fence works on your card (same idea as HAMi#3156), with HAMi switched on: llama.cpp loading Qwen3 1.7B with
# an 8K context and auto-fit off needs ~3 GB of VRAM. In a 2000 MiB slice HAMi-core must refuse it
# (CUDA out of memory, pod fails); in a 4000 MiB slice it must load. Needs HAMi (hami.sh).
# The 4 GB run is the same pod with two values changed:
#   sed "s/fence-2g/fence-4g/; s/gpumem: 2000/gpumem: 4000/" fence-test.yaml | sudo k3s kubectl apply -f -
apiVersion: v1
kind: Pod
metadata: { name: fence-2g, namespace: demo }
spec:
  restartPolicy: Never
  containers:
    - name: llama
      image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11515@sha256:ccfd96bb2aba4ef77e3df656d713ce85bf3c6a886d7974243127c5ad66ca6d2a
      command: ["sh", "-c"]
      # Load, print the GPU memory the pod sees, exit 0 once the server is up (exit 1 if the load fails).
      args:
        - |
          nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader
          /app/llama-server -m /models/Qwen3-1.7B-Q8_0.gguf -ngl 999 --fit off -c 8192 --port 8080 & p=$!
          for i in $(seq 120); do
            curl -sf localhost:8080/health >/dev/null && { echo "FENCE: loaded"; nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader; kill $p; exit 0; }
            kill -0 $p 2>/dev/null || { echo "FENCE: load failed"; exit 1; }
            sleep 1
          done; echo "FENCE: timeout"; exit 2
      resources:
        limits: { nvidia.com/gpu: 1, nvidia.com/gpumem: 2000 }
      volumeMounts: [{ name: models, mountPath: /models, readOnly: true }]
  volumes:
    - name: models
      hostPath: { path: /srv/models/qwen3-1.7b, type: Directory }
