# Image pod: stable-diffusion.cpp sd-server (llama.cpp's sibling, same ggml CUDA engine) + SDXL-Turbo, its own
# web UI. 1 step, CFG 1, euler_a, 512x512, random seed; weights on the GPU at start (--eager-load).
# image.yaml = without HAMi, image-hami.yaml = with HAMi: the two files differ only in the lines marked ◀.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image
  namespace: demo
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: image } }
  template:
    metadata:
      labels:
        app: image
    spec:
      terminationGracePeriodSeconds: 5   # sd-server ignores SIGTERM; don't wait 30 s for it
      containers:
        - name: sd
          # upstream publishes only a moving master-cuda tag: this digest is the pin (versions.env SD_IMAGE)
          image: ghcr.io/leejet/stable-diffusion.cpp:master-cuda@sha256:834bfb16c7f2443c3bb3186d3add311ef4653b996bab4a9a04e9fb9e756f3076
          command: ["sh", "-c"]
          args:
            - exec /sd.cpp/bin/sd-server -m /models/sd_xl_turbo_1.0_fp16.safetensors --steps 1 --cfg-scale 1 --sampling-method euler_a -W 512 -H 512 -s -1 --eager-load --listen-ip 0.0.0.0 --listen-port 1234
          env:
            - { name: CUDA_CACHE_PATH, value: /cuda-cache }   # CUDA 12.6 build, compiled for Blackwell on first
            - { name: CUDA_CACHE_MAXSIZE, value: "1073741824" }   # use (~1 min); kept on the host
            - { name: TZ, value: IST-5:30 }   # POSIX form, no tzdata needed: set yours so nvidia-smi in the pod matches the host
          ports: [{ name: http, containerPort: 1234 }]
          readinessProbe:   # Ready once the weights are on the GPU (~20-60 s from a hard disk)
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 150
          resources:
            limits:
              nvidia.com/gpu: 1   # one GPU
              nvidia.com/gpumem: 10000   # ◀ with HAMi: a 10 GB slice of it (MiB); HAMi schedules + fences it
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: cuda-cache, mountPath: /cuda-cache }
      volumes:
        - name: models
          hostPath: { path: /srv/models/sdxl-turbo, type: Directory }
        - name: cuda-cache
          hostPath: { path: /var/cache/gpu-sharing-demo/cuda-cache, type: DirectoryOrCreate }
