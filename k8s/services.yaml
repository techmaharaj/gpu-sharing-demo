# The demo namespace + the two web pages' services, applied by demo.sh reset so the pages' ports exist
# before any pod does. NodePorts are fixed: 30080 chat, 30081 image.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: demo
spec:
  type: NodePort   # fixed port on the node: http://<node>:30080 (chat), :30081 (image)
  selector: { app: chat }
  ports: [{ name: http, port: 80, targetPort: http, nodePort: 30080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: image
  namespace: demo
spec:
  type: NodePort   # fixed port on the node: http://<node>:30080 (chat), :30081 (image)
  selector: { app: image }
  ports: [{ name: http, port: 80, targetPort: http, nodePort: 30081 }]
